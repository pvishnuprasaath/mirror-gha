name: 'Docker Hello Action'
description: 'A minimal Docker action, for testing uses: (runs.using: docker) with mirror-gha'
inputs:
  who-to-greet:
    description: 'Who to greet'
    required: true
    default: 'World'
outputs:
  greeting:
    description: 'The greeting message'
runs:
  using: 'docker'
  image: 'Dockerfile'

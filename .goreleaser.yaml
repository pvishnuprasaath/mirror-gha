version: 2

project_name: mirror-gha

builds:
  - id: mirror
    main: ./cmd/mirror
    binary: mirror
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # No custom ldflags: GoReleaser's default
    # (-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}
    #  -X main.date={{.Date}} -X main.builtBy=goreleaser)
    # targets exactly the var names declared in cmd/mirror/main.go.

archives:
  - id: mirror-archive
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  use: git
  sort: asc
  groups:
    - title: "Fixed"
      regexp: '^fix(\(.+\))?:'
      order: 0
    - title: "Added"
      regexp: '^feat(\(.+\))?:'
      order: 1
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: pvishnuprasaath
    name: mirror-gha
  prerelease: auto

# Homebrew tap publishing. REQUIRES, before the next tag is pushed:
#   1. The pvishnuprasaath/homebrew-tap repo to exist (can be empty —
#      GoReleaser creates Casks/ and commits the formula itself).
#   2. A repo secret named TAP_GITHUB_TOKEN on mirror-gha, holding a PAT
#      with write access to homebrew-tap.
# Without both, the release workflow's Homebrew step will fail (even
# though the GitHub Release/binaries step, which runs first, still
# succeeds). See docs/RELEASING.md for the exact steps.
#
# Uses homebrew_casks, not the legacy brews section — brews (Formula)
# was fully deprecated in GoReleaser v2.16 in favor of casks for
# distributing precompiled binaries.
homebrew_casks:
  - name: mirror-gha
    repository:
      owner: pvishnuprasaath
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    binaries:
      - mirror
    homepage: "https://github.com/pvishnuprasaath/mirror-gha"
    description: "Test your GitHub Actions workflows locally — for real."
    # The binary isn't code-signed/notarized (needs a paid Apple Developer
    # account, not set up yet) — without this, macOS Gatekeeper quarantines
    # the download and the binary is silently killed (exit 137, no error
    # message) on first run. Confirmed for real: v0.1.2's cask install
    # succeeded but `mirror version` died silently until this hook was
    # added. Revisit once code signing is worth the cost.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/mirror"]
          end
